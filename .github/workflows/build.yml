name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --verbosity normal

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish --verbosity normal

      - name: List publish directory
        run: Get-ChildItem ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SooFunPkg.exe
          path: ./publish/SooFunPkg.exe
